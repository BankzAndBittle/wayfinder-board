# Keep the Mermaid diagram on each Wayfinder map current.
# GitHub Actions has no trigger for sub-issue or dependency changes, so an hourly sweep covers those.
name: wayfinder-board

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: wayfinder-board
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post the board to affected maps
        run: |
          if [ -n "$ISSUE" ]; then
            # The changed issue is a map itself, or a ticket whose parent is a map.
            maps=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){url labels(first:20){nodes{name}} parent{url labels(first:20){nodes{name}}}}}}' \
              -f o="${GH_REPO%/*}" -f r="${GH_REPO#*/}" -F n="$ISSUE" \
              --jq '.data.repository.issue | [., .parent] | .[] | select(. != null) | select(any(.labels.nodes[]; .name == "wayfinder:map")) | .url')
          else
            maps=$(gh issue list --label wayfinder:map --state open --limit 100 --json url --jq '.[].url')
          fi
          for map in $maps; do
            npx -y wayfinder-board@latest "$map" --post
          done
